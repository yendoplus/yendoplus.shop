<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Confirmar pedido — Yendo Plus</title>
<link rel="icon" type="image/jpeg" href="A/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="logo-wrap">
    <a href="index.html"><img src="A/logo.jpg" alt="Yendo Plus" onerror="imgFallback(this,'logo')"></a>
  </div>
  <nav class="main"><a href="index.html" style="font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;">← Volver al catálogo</a></nav>
  <div class="socials-top">
    <button id="themeToggle" class="theme-switch" aria-label="Cambiar tema" aria-pressed="false">
      <span class="theme-switch-track">
        <span class="theme-switch-icon">☀️</span>
        <span class="theme-switch-icon">🌙</span>
        <span class="theme-switch-thumb"></span>
      </span>
    </button>
    <div class="cart-wrap" id="cartWrap">
      <button id="cartToggle" class="cart-link" aria-label="Ver carrito">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Carrito <span id="cartBadge" class="cart-badge">0</span>
      </button>
      <div class="mini-cart" id="miniCart">
        <div class="mini-cart-top">
          <span id="miniCartCount">0 items</span>
          <span id="miniCartTotal">S/0.00</span>
        </div>
        <a href="cart.html" class="mini-cart-checkout">IR AL CARRITO</a>
        <div class="mini-cart-items" id="miniCartItems"></div>
      </div>
    </div>
  </div>
</header>

<section class="section" style="border-bottom:none;">
  <div class="section-head">
    <h2>Confirmar pedido</h2>
    <span class="sub" id="itemCountLabel"></span>
  </div>

  <div id="cartContent"></div>
</section>

<button id="backToTop" class="back-to-top" aria-label="Subir arriba">↑</button>

<script src="theme.js"></script>
<script src="cart.js"></script>
<script>
const WHATSAPP_NUMBER = "51915276379";

/* Pocas extensiones, sin combinar mayusculas/minusculas del nombre: maximo 6 intentos por imagen,
   para no saturar GitHub Pages con peticiones fallidas (eso disparaba el bloqueo "Rate limit exceeded") */
const IMG_EXTS = ['jpg','jpeg','png','JPG','webp','PNG'];

/* Codifica cada segmento de una ruta con carpetas sin romper las barras "/" */
function encodePath(path){
  return path.split('/').map(seg => encodeURIComponent(seg)).join('/');
}

/* Imagen en la raiz del sitio. Usa el nombre EXACTO tal como esta escrito, sin adivinar mayusculas. */
function imgCandidates(name){
  const trimmed = (name || '').trim();
  return IMG_EXTS.map(ext => `A/${encodeURIComponent(trimmed)}.${ext}`);
}
function imgFirstSrc(name){
  return imgCandidates(name)[0];
}
function imgFallback(el, name, fallback){
  if(!el.dataset.candidates){
    el.dataset.candidates = JSON.stringify(imgCandidates(name));
    el.dataset.tryIdx = '0';
  }
  const candidates = JSON.parse(el.dataset.candidates);
  const idx = parseInt(el.dataset.tryIdx) + 1;
  if(idx < candidates.length){
    el.dataset.tryIdx = idx;
    el.src = candidates[idx];
  } else if(fallback && el.src !== fallback){
    el.src = fallback;
  } else {
    el.style.opacity = 0;
  }
}

/* Imagen dentro de una carpeta. Usa el nombre y la carpeta EXACTOS, sin adivinar variantes. */
/* Si el nombre tiene un "(" pegado a la letra anterior, agrega tambien la variante con espacio */
function spacedVariant(name){
  return name.replace(/([^\s])\(/g, '$1 (');
}
function imgCandidatesIn(folder, name){
  const f = (folder || '').trim();
  const trimmed = (name || '').trim();
  const spaced = spacedVariant(trimmed);
  const names = spaced !== trimmed ? [trimmed, spaced] : [trimmed];
  const list = [];
  names.forEach(n => IMG_EXTS.forEach(ext => list.push(`A/${encodePath(f)}/${encodeURIComponent(n)}.${ext}`)));
  return list;
}
function imgFirstSrcIn(folder, name){
  return imgCandidatesIn(folder, name)[0];
}
function imgFallbackIn(el, folder, name, fallback){
  if(!el.dataset.candidatesIn){
    el.dataset.candidatesIn = JSON.stringify(imgCandidatesIn(folder, name));
    el.dataset.tryIdxIn = '0';
  }
  const candidates = JSON.parse(el.dataset.candidatesIn);
  const idx = parseInt(el.dataset.tryIdxIn) + 1;
  if(idx < candidates.length){
    el.dataset.tryIdxIn = idx;
    el.src = candidates[idx];
  } else if(fallback && el.src !== fallback){
    el.src = fallback;
  } else {
    el.style.opacity = 0;
  }
}
let selectedDelivery = null;
let selectedPayment = null;

const DELIVERY_LABELS = {
  almacen: "Recojo en almacén (Cedros de Villa, Chorrillos)",
  feria: "Recojo en feria (sábados)",
  shalom: "Envío por Shalom"
};

const PAYMENT_OPTIONS = [
  { value: "directo",  label: "Yape / Plin / Transferencia",      surcharge: false, inPersonOnly: false },
  { value: "efectivo", label: "Efectivo",                          surcharge: false, inPersonOnly: true  },
  { value: "pos",      label: "POS en persona (+5%)",              surcharge: true,  inPersonOnly: true  },
  { value: "tarjeta",  label: "Tarjeta vía MercadoPago (+5%)",      surcharge: true,  inPersonOnly: false }
];

function availablePaymentOptions(){
  const inPerson = selectedDelivery === 'almacen' || selectedDelivery === 'feria';
  return PAYMENT_OPTIONS.filter(o => !o.inPersonOnly || inPerson);
}

function isSurchargePayment(value){
  const opt = PAYMENT_OPTIONS.find(o => o.value === value);
  return opt ? opt.surcharge : false;
}

function paymentLabel(value){
  const opt = PAYMENT_OPTIONS.find(o => o.value === value);
  return opt ? opt.label : value;
}

function feriaAdvance(subtotal){
  return subtotal < 100 ? 5 : subtotal * 0.05;
}

function renderCart(){
  const cart = getCart();
  const container = document.getElementById('cartContent');
  document.getElementById('itemCountLabel').textContent = `${cartCount()} artículo${cartCount()===1?'':'s'}`;

  if(cart.length === 0){
    container.innerHTML = `<div class="empty-cart">
      Tu carrito está vacío.<br><br>
      <a href="index.html">Ver catálogo →</a>
    </div>`;
    return;
  }

  const rows = cart.map(i => `
    <div class="cart-row" data-id="${i.id}">
      <img src="${i.img}" alt="${i.name}" data-cands='${i.cands ? JSON.stringify(i.cands).replace(/'/g,"&#39;") : ''}' onerror="miniCartImgError(this,'${i.folder}','${i.id}','${i.fallbackImg}')">
      <div class="ci-info">
        <div class="ci-name">${i.name}</div>
        <div class="ci-id">${i.id}</div>
        <div class="ci-price">${fmtPrice(i.price)} c/u</div>
      </div>
      <div class="qty-stepper">
        <button class="qty-minus" data-id="${i.id}">−</button>
        <input type="number" min="1" value="${i.qty}" class="qty-input" data-id="${i.id}">
        <button class="qty-plus" data-id="${i.id}">+</button>
      </div>
      <div class="ci-subtotal">${fmtPrice(parseFloat(i.price) * i.qty)}</div>
      <button class="ci-remove" data-id="${i.id}">Quitar</button>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="cart-layout">
      <div class="cart-items">
        <div class="cart-header-row">
          <span class="ch-product"></span>
          <span class="ch-id"><span>Producto</span><span>ID</span></span>
          <span class="ch-qty">Cantidad</span>
          <span class="ch-price">Precio</span>
        </div>
        ${rows}
      </div>
      <div class="order-box">
        <h3>Datos del pedido</h3>

        <div class="field-group">
          <label for="buyerName">Nombre y apellido</label>
          <input type="text" id="buyerName" placeholder="Tu nombre completo" autocomplete="name">
          <p class="field-hint" id="nameHint"></p>
        </div>
        <div class="field-group">
          <label for="buyerPhone">Teléfono de contacto (9 dígitos)</label>
          <input type="tel" id="buyerPhone" placeholder="987654321" inputmode="numeric" maxlength="9" autocomplete="tel">
          <p class="field-hint" id="phoneHint"></p>
        </div>

        <div class="option-group-label">Entrega</div>
        <div class="option-buttons" id="deliveryOptions">
          <button type="button" class="option-btn" data-group="delivery" data-value="almacen">Recojo en almacén</button>
          <button type="button" class="option-btn" data-group="delivery" data-value="feria">Recojo en feria</button>
          <button type="button" class="option-btn" data-group="delivery" data-value="shalom">Envío por Shalom</button>
        </div>
        <div class="field-group" id="dniGroup" style="display:none;">
          <label for="buyerDni">DNI (para envío Shalom)</label>
          <input type="text" id="buyerDni" placeholder="Tu DNI" inputmode="numeric">
        </div>

        <div class="feria-note" id="feriaNote" style="display:none;"></div>

        <div class="option-group-label">Método de pago</div>
        <div class="option-buttons" id="paymentOptions"></div>

        <div class="order-row"><span>Subtotal</span><span id="sumSubtotal">S/0.00</span></div>
        <div class="order-row" id="surchargeRow" style="display:none;"><span id="surchargeLabel">Recargo (5%)</span><span id="sumSurcharge">S/0.00</span></div>
        <div class="order-total"><span>Total</span><span id="sumTotal">S/0.00</span></div>

        <button class="send-btn" id="sendBtn">FINALIZAR COMPRA</button>
        <a href="index.html" class="back-link">← Volver a la página</a>
        <p class="form-note">Se abrirá WhatsApp con el detalle de tu pedido para confirmar contigo.</p>
      </div>
    </div>
  `;

  attachCartEvents();
  renderPaymentOptions();
  updateTotals();
}

function renderPaymentOptions(){
  const wrap = document.getElementById('paymentOptions');
  const options = availablePaymentOptions();

  if(selectedPayment && !options.find(o => o.value === selectedPayment)){
    selectedPayment = null;
  }

  wrap.innerHTML = options.map(o =>
    `<button type="button" class="option-btn${selectedPayment===o.value?' selected':''}" data-group="payment" data-value="${o.value}">${o.label}</button>`
  ).join('');

  wrap.querySelectorAll('.option-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>selectOption('payment', btn.dataset.value, btn));
  });
}

function attachCartEvents(){
  document.querySelectorAll('.qty-minus').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cart = getCart();
      const item = cart.find(i=>i.id===btn.dataset.id);
      if(item) setQty(item.id, item.qty - 1 < 1 ? 1 : item.qty - 1);
      renderCart();
    });
  });
  document.querySelectorAll('.qty-plus').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cart = getCart();
      const item = cart.find(i=>i.id===btn.dataset.id);
      if(item) setQty(item.id, item.qty + 1);
      renderCart();
    });
  });
  document.querySelectorAll('.qty-input').forEach(input=>{
    input.addEventListener('change', ()=>{
      setQty(input.dataset.id, input.value);
      renderCart();
    });
  });
  document.querySelectorAll('.ci-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      removeFromCart(btn.dataset.id);
      renderCart();
    });
  });

  document.querySelectorAll('.option-btn[data-group="delivery"]').forEach(btn=>{
    btn.addEventListener('click', ()=>selectOption('delivery', btn.dataset.value, btn));
  });

  document.getElementById('sendBtn').addEventListener('click', sendOrder);

  const nameInput = document.getElementById('buyerName');
  nameInput.addEventListener('input', ()=>{
    const clean = nameInput.value.replace(/[^A-Za-zÀ-ÿ\s]/g, '');
    if(clean !== nameInput.value) nameInput.value = clean;
    document.getElementById('nameHint').textContent = '';
  });

  const phoneInput = document.getElementById('buyerPhone');
  phoneInput.addEventListener('input', ()=>{
    const clean = phoneInput.value.replace(/[^0-9]/g, '').slice(0, 9);
    if(clean !== phoneInput.value) phoneInput.value = clean;
    document.getElementById('phoneHint').textContent = '';
  });
}

function selectOption(group, value, btnEl){
  document.querySelectorAll(`.option-btn[data-group="${group}"]`).forEach(b=>b.classList.remove('selected'));
  btnEl.classList.add('selected');

  if(group === 'delivery'){
    selectedDelivery = value;
    document.getElementById('dniGroup').style.display = value === 'shalom' ? 'block' : 'none';
    renderPaymentOptions();
  }
  if(group === 'payment'){
    selectedPayment = value;
  }
  updateTotals();
}

function updateTotals(){
  const subtotal = cartTotal();
  const surcharge = isSurchargePayment(selectedPayment) ? subtotal * 0.05 : 0;
  const total = subtotal + surcharge;

  document.getElementById('sumSubtotal').textContent = fmtPrice(subtotal);
  document.getElementById('surchargeRow').style.display = surcharge > 0 ? 'flex' : 'none';
  document.getElementById('surchargeLabel').textContent = selectedPayment === 'pos' ? 'Recargo POS (5%)' : 'Recargo tarjeta (5%)';
  document.getElementById('sumSurcharge').textContent = fmtPrice(surcharge);
  document.getElementById('sumTotal').textContent = fmtPrice(total);

  const feriaNote = document.getElementById('feriaNote');
  if(selectedDelivery === 'feria'){
    const advance = feriaAdvance(subtotal);
    feriaNote.style.display = 'block';
    feriaNote.innerHTML = `<strong>Adelanto para reservar en feria:</strong> ${fmtPrice(advance)} vía Yape/Plin ` +
      `(S/5.00 si el pedido es menor a S/100.00, o 5% si es S/100.00 a más).`;
  } else {
    feriaNote.style.display = 'none';
  }
}

function sendOrder(){
  const cart = getCart();
  if(cart.length === 0) return;

  const nameInput = document.getElementById('buyerName');
  const phoneInput = document.getElementById('buyerPhone');
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const dni = document.getElementById('buyerDni').value.trim();

  const namePattern = /^[A-Za-zÀ-ÿ\s]+$/;
  const phonePattern = /^\d{9}$/;

  if(!name || !namePattern.test(name)){
    document.getElementById('nameHint').textContent = 'Ingresa tu nombre usando solo letras.';
    nameInput.focus();
    return;
  }
  if(!phonePattern.test(phone)){
    document.getElementById('phoneHint').textContent = 'El teléfono debe tener exactamente 9 dígitos.';
    phoneInput.focus();
    return;
  }
  if(!selectedDelivery){ alert('Por favor elige un método de entrega.'); return; }
  if(!selectedPayment){ alert('Por favor elige un método de pago.'); return; }
  if(selectedDelivery === 'shalom' && !dni){ alert('Por favor ingresa tu DNI para el envío por Shalom.'); return; }

  const subtotal = cartTotal();
  const surcharge = isSurchargePayment(selectedPayment) ? subtotal * 0.05 : 0;
  const total = subtotal + surcharge;

  const lines = cart.map(i => `• ${i.name} x${i.qty} — ${fmtPrice(parseFloat(i.price) * i.qty)}`);

  let msg = `Hola, quiero hacer un pedido en Yendo Plus:\n\n`;
  msg += lines.join('\n');
  msg += `\n\nSubtotal: ${fmtPrice(subtotal)}`;
  if(surcharge > 0){
    msg += `\n${selectedPayment === 'pos' ? 'Recargo POS (5%)' : 'Recargo tarjeta (5%)'}: ${fmtPrice(surcharge)}`;
  }
  msg += `\nTotal: ${fmtPrice(total)}`;
  msg += `\n\nEntrega: ${DELIVERY_LABELS[selectedDelivery]}`;
  if(selectedDelivery === 'feria'){
    msg += `\nAdelanto para reservar (Yape/Plin): ${fmtPrice(feriaAdvance(subtotal))}`;
  }
  msg += `\nPago: ${paymentLabel(selectedPayment)}`;
  if(selectedPayment === 'tarjeta'){
    msg += `\n(Coordinamos el link de pago de MercadoPago por el monto total)`;
  }
  msg += `\n\nNombre: ${name}`;
  msg += `\nTeléfono: ${phone}`;
  if(selectedDelivery === 'shalom'){
    msg += `\nDNI: ${dni}`;
  }

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  clearCart();
  selectedDelivery = null;
  selectedPayment = null;
  renderCart();
}

renderCart();

/* ===== BOTON SUBIR ARRIBA ===== */
const backToTop = document.getElementById('backToTop');
if(backToTop){
  window.addEventListener('scroll', ()=>{
    backToTop.classList.toggle('show', window.scrollY > 400);
  });
  backToTop.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
</script>

</body>
</html>
