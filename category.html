<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Categoría — Yendo Plus</title>
<link rel="icon" type="image/jpeg" href="A/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="logo-wrap">
    <a href="index.html"><img src="A/logo.jpg" alt="Yendo Plus" onerror="imgFallback(this,'logo')"></a>
  </div>
  <nav class="main" id="navCats"></nav>
  <div class="socials-top">
    <button id="themeToggle" class="theme-switch" aria-label="Cambiar tema" aria-pressed="false">
      <span class="theme-switch-track">
        <span class="theme-switch-icon">☀️</span>
        <span class="theme-switch-icon">🌙</span>
        <span class="theme-switch-thumb"></span>
      </span>
    </button>
    <div class="cart-wrap" id="cartWrap">
      <button id="cartToggle" class="cart-link" aria-label="Ver carrito">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Carrito <span id="cartBadge" class="cart-badge">0</span>
      </button>
      <div class="mini-cart" id="miniCart">
        <div class="mini-cart-top">
          <span id="miniCartCount">0 items</span>
          <span id="miniCartTotal">S/0.00</span>
        </div>
        <a href="cart.html" class="mini-cart-checkout">IR AL CARRITO</a>
        <div class="mini-cart-items" id="miniCartItems"></div>
      </div>
    </div>
  </div>
</header>

<section class="section" style="border-bottom:none;">
  <div class="section-head">
    <h2 id="catTitle">Categoría</h2>
    <span class="sub" id="catCount">Cargando…</span>
  </div>

  <div class="cat-page-layout">
    <aside class="cat-sidebar">
      <div class="sidebar-block">
        <label for="searchInput">Buscar</label>
        <input type="text" id="searchInput" placeholder="Nombre o categoría...">
      </div>

      <div class="sidebar-block">
        <div class="filter-head">
          <label style="margin-bottom:0;">Categoría</label>
          <button type="button" id="clearFilters" class="clear-filters">Limpiar selección</button>
        </div>
        <div id="filterLevels" class="cat-filter-stack"></div>
      </div>

      <div class="sidebar-block">
        <label for="sortSelect">Ordenar por</label>
        <select id="sortSelect">
          <option value="default">Relevancia</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="alpha">Alfabético (A-Z)</option>
        </select>
      </div>

      <a href="index.html" class="back-link" style="text-align:left;margin-top:20px;">← Ver todas las categorías</a>
    </aside>

    <div class="cat-page-products" id="catProducts">
      <div class="loading">Cargando productos…</div>
    </div>
  </div>
</section>

<div class="img-modal" id="imgModal">
  <button class="img-modal-close" id="imgModalClose" aria-label="Cerrar">✕</button>
  <img id="imgModalPic" src="" alt="">
</div>

<button id="backToTop" class="back-to-top" aria-label="Subir arriba">↑</button>

<script src="theme.js"></script>
<script src="cart.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS10PBfQSSGt0J_UBzOrnICPcVjKV1smtbm36aBdPuokZaaiJgdScdwOWig8PqIDJyBTIX2fk4q4QzU/pub?output=csv";
const MAX_LEVELS = 4;

function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c=='"'){ if(text[i+1]=='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    } else {
      if(c=='"') inQuotes=true;
      else if(c==','){ row.push(field); field=''; }
      else if(c=='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c=='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1);
}

function toObjects(rows){
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=(r[i]||'').trim());
    return o;
  });
}

function getCatLevel(p, level){
  return (p['CATEGORIA'+level] || '').trim();
}

/* Prueba varios formatos de imagen (jpg, png, jpeg, webp) antes de usar el respaldo del Excel */
const IMG_EXTS = ['jpg','png','jpeg','webp'];
/* Genera todas las combinaciones a probar: nombre tal cual / en minusculas / en mayusculas, x cada extension */
function imgCandidates(name){
  const trimmed = (name || '').trim();
  const cases = [...new Set([trimmed, trimmed.toLowerCase(), trimmed.toUpperCase()])];
  const list = [];
  cases.forEach(c => IMG_EXTS.forEach(ext => list.push(`A/${encodeURIComponent(c)}.${ext}`)));
  return list;
}
function imgFirstSrc(name){
  return imgCandidates(name)[0];
}
function imgFallback(el, name, fallback){
  if(!el.dataset.candidates){
    el.dataset.candidates = JSON.stringify(imgCandidates(name));
    el.dataset.tryIdx = '0';
  }
  const candidates = JSON.parse(el.dataset.candidates);
  const idx = parseInt(el.dataset.tryIdx) + 1;
  if(idx < candidates.length){
    el.dataset.tryIdx = idx;
    el.src = candidates[idx];
  } else if(fallback && el.src !== fallback){
    el.src = fallback;
  } else {
    el.style.display = 'none';
  }
}

function getStockNum(p){
  const n = parseInt(p.stock);
  return isNaN(n) ? 0 : n;
}

function getDiscountPercent(p){
  for(const key in p){
    if(key.toLowerCase().includes('descuento')){
      const raw = (p[key] || '').replace('%','').trim();
      const n = parseFloat(raw);
      if(!isNaN(n) && n > 0) return n;
    }
  }
  return 0;
}

function getFinalPrice(p){
  const base = parseFloat(p.price) || 0;
  const discount = getDiscountPercent(p);
  return discount > 0 ? base * (1 - discount / 100) : base;
}

function qtyInCart(id){
  const item = getCart().find(i => i.id === id);
  return item ? item.qty : 0;
}

function productCardHTML(p){
  const stockNum = getStockNum(p);
  const inStock = stockNum > 0;
  const inCart = qtyInCart(p.id);
  const canAddMore = inStock && inCart < stockNum;

  const basePrice = parseFloat(p.price) || 0;
  const discount = getDiscountPercent(p);
  const finalPrice = getFinalPrice(p);

  const priceHTML = discount > 0
    ? `<div class="price-wrap">
         <span class="price-old">S/${basePrice.toFixed(2)}</span>
         <span class="discount-badge">-${discount}%</span>
         <span class="price-new"><span class="yn">S/</span>${finalPrice.toFixed(2)}</span>
       </div>`
    : `<div class="price"><span class="yn">S/</span>${basePrice.toFixed(2)}</div>`;

  let btnHTML;
  if(!inStock){
    btnHTML = `<button type="button" class="add-cart-btn" disabled>Agotado</button>`;
  } else if(!canAddMore){
    btnHTML = `<button type="button" class="add-cart-btn" disabled>Stock máximo en carrito</button>`;
  } else {
    btnHTML = `<button type="button" class="add-cart-btn" data-id="${p.id}">Agregar al carro</button>`;
  }

  return `<div class="prod-card">
    <div class="prod-img ${inStock?'':'out-of-stock'}">
      <span class="stock-badge ${inStock?'in':'out'}">${inStock?'En stock':'Agotado'}</span>
      <img src="${imgFirstSrc(p.id)}" alt="${p.name}" loading="lazy" class="zoomable" onerror="imgFallback(this, '${p.id}', '${p.img}')">
    </div>
    <div class="prod-body">
      <span class="prod-cat">${getCatLevel(p,1)}</span>
      <div class="prod-name">${p.name}</div>
      ${p.description ? `<div class="prod-desc">${p.description}</div>` : ''}
      <div class="prod-footer">
        ${priceHTML}
        <a class="prod-link" href="${p.url}" target="_blank">Ver ficha →</a>
      </div>
      ${btnHTML}
    </div>
  </div>`;
}

const params = new URLSearchParams(window.location.search);
let selectedLevels = [];
for(let level=1; level<=MAX_LEVELS; level++){
  const key = level===1 ? 'cat' : `sub${level}`;
  const val = params.get(key);
  if(val) selectedLevels[level-1] = val;
}

let allProducts = [];

fetch(CSV_URL)
  .then(r=>r.text())
  .then(text=>{
    const rows=parseCSV(text);
    allProducts = toObjects(rows).filter(p=>p.name);
    buildNav();
    buildFilterSidebar();
    updateTitle();
    updateNavActiveState();

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);

    render();
  })
  .catch(()=>{
    document.getElementById('catProducts').innerHTML =
      '<div class="empty-state">No se pudo cargar el catálogo en este momento. Verifica tu conexión o intenta más tarde.</div>';
  });

function updateTitle(){
  document.getElementById('catTitle').textContent = selectedLevels[0] || 'Todos los productos';
}

function updateNavActiveState(){
  const links = document.querySelectorAll('#navCats > .nav-item > a');
  links.forEach(a=>{
    const url = new URL(a.getAttribute('href'), window.location.href);
    const linkCat = url.searchParams.get('cat') || '';
    const isActive = linkCat === (selectedLevels[0] || '');
    a.classList.toggle('active-link', isActive);
  });
}

function matchesSelection(p, upToLevel){
  for(let i=0;i<upToLevel;i++){
    if(selectedLevels[i] && getCatLevel(p, i+1) !== selectedLevels[i]) return false;
  }
  return true;
}

/* ===== Barra lateral: filtros en cascada (Categoria -> Subcategoria 1 -> 2 -> 3...) hasta que ya no haya mas niveles ===== */
function buildFilterSidebar(){
  const container = document.getElementById('filterLevels');
  container.innerHTML = '';

  for(let level=1; level<=MAX_LEVELS; level++){
    const base = allProducts.filter(p => matchesSelection(p, level-1));
    const values = [...new Set(base.map(p=>getCatLevel(p, level)).filter(Boolean))];
    if(values.length === 0) break;

    const placeholder = level===1 ? 'Elegir categoría' : 'Elegir subcategoría';
    const currentVal = selectedLevels[level-1] || '';

    const div = document.createElement('div');
    div.className = 'cat-filter-box';
    div.innerHTML = `<select>
        <option value="">${placeholder}</option>
        ${values.map(v=>`<option value="${v}"${v===currentVal?' selected':''}>${v}</option>`).join('')}
      </select>`;
    container.appendChild(div);

    div.querySelector('select').addEventListener('change', (e)=>{
      selectedLevels = selectedLevels.slice(0, level-1);
      if(e.target.value) selectedLevels[level-1] = e.target.value;
      buildFilterSidebar();
      updateTitle();
      updateNavActiveState();
      render();
    });
  }
}

document.getElementById('clearFilters').addEventListener('click', ()=>{
  selectedLevels = [];
  buildFilterSidebar();
  updateTitle();
  updateNavActiveState();
  render();
});

/* ===== Nav superior con menu en cascada (CATEGORIA1 -> 2 -> 3 -> 4, tantos niveles como haya datos) ===== */
function buildLevel(items, level, urlParams){
  const values=[...new Set(items.map(p=>getCatLevel(p, level)).filter(Boolean))];
  if(values.length === 0) return '';

  const linksHTML = values.map(v=>{
    const key = level===1 ? 'cat' : `sub${level}`;
    const newParams = Object.assign({}, urlParams, {[key]: v});
    const href = 'category.html?' + new URLSearchParams(newParams).toString();
    const filtered = items.filter(p=>getCatLevel(p, level)===v);
    const childHTML = buildLevel(filtered, level+1, newParams);

    if(level === 1){
      const isActive = v === (selectedLevels[0]||'') ? ' class="active-link"' : '';
      return `<div class="nav-item"><a href="${href}"${isActive}>${v}</a>${childHTML}</div>`;
    }
    const hasChildren = childHTML !== '';
    return `<div class="nav-subitem${hasChildren?' has-children':''}"><a href="${href}">${v}</a>${childHTML}</div>`;
  }).join('');

  if(level === 1) return linksHTML;
  const wrapClass = level === 2 ? 'nav-dropdown' : 'nav-dropdown-l2';
  return `<div class="${wrapClass}"><div class="nav-dropdown-inner">${linksHTML}</div></div>`;
}

function buildNav(){
  const nav=document.getElementById('navCats');
  const todoActive = !selectedLevels[0] ? ' class="active-link"' : '';
  nav.innerHTML = `<div class="nav-item"><a href="category.html"${todoActive}>Todo</a></div>` + buildLevel(allProducts, 1, {});
}

function render(){
  let list = allProducts.filter(p => matchesSelection(p, selectedLevels.length));

  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  if(term){
    list = list.filter(p => {
      if(p.name.toLowerCase().includes(term)) return true;
      for(let level=1; level<=MAX_LEVELS; level++){
        if(getCatLevel(p, level).toLowerCase().includes(term)) return true;
      }
      return false;
    });
  }

  const sortVal = document.getElementById('sortSelect').value;
  if(sortVal === 'price-asc'){
    list.sort((a,b)=>getFinalPrice(a) - getFinalPrice(b));
  } else if(sortVal === 'price-desc'){
    list.sort((a,b)=>getFinalPrice(b) - getFinalPrice(a));
  } else if(sortVal === 'alpha'){
    list.sort((a,b)=>a.name.localeCompare(b.name));
  }

  document.getElementById('catCount').textContent = `${list.length} producto${list.length===1?'':'s'}`;

  const container = document.getElementById('catProducts');
  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">No se encontraron productos con estos filtros.</div>';
    return;
  }
  container.innerHTML = `<div class="prod-grid">${list.map(productCardHTML).join('')}</div>`;

  container.querySelectorAll('.add-cart-btn').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', function(){
      const p = allProducts.find(x => x.id === btn.dataset.id);
      if(!p) return;
      addToCart({ id:p.id, name:p.name, price:getFinalPrice(p), img:`A/${p.id}.jpg`, fallbackImg:p.img, stock: getStockNum(p) });
      render();
    });
  });

  container.querySelectorAll('.zoomable').forEach(img=>{
    img.addEventListener('click', ()=> openImgModal(img.src, img.alt));
  });
}

function openImgModal(src, alt){
  document.getElementById('imgModalPic').src = src;
  document.getElementById('imgModalPic').alt = alt || '';
  document.getElementById('imgModal').classList.add('open');
}
function closeImgModal(){
  document.getElementById('imgModal').classList.remove('open');
}
document.getElementById('imgModalClose').addEventListener('click', closeImgModal);
document.getElementById('imgModal').addEventListener('click', (e)=>{
  if(e.target.id === 'imgModal') closeImgModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeImgModal();
});

/* ===== BOTON SUBIR ARRIBA ===== */
const backToTop = document.getElementById('backToTop');
if(backToTop){
  window.addEventListener('scroll', ()=>{
    backToTop.classList.toggle('show', window.scrollY > 400);
  });
  backToTop.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
</script>

</body>
</html>
