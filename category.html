<script src="theme.js"></script>
<script src="cart.js"></script>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS10PBfQSSGt0J_UBzOrnICPcVjKV1smtbm36aBdPuokZaaiJgdScdwOWig8PqIDJyBTIX2fk4q4QzU/pub?output=csv";
const MAX_LEVELS = 4;

function parseCSV(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c=='"'){ if(text[i+1]=='"'){field+='"';i++;} else inQuotes=false; }
      else field+=c;
    } else {
      if(c=='"') inQuotes=true;
      else if(c==','){ row.push(field); field=''; }
      else if(c=='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c=='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1);
}

function toObjects(rows){
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=(r[i]||'').trim());
    return o;
  });
}

function getCatLevel(p, level){
  return (p['CATEGORIA'+level] || '').trim();
}

/* Busca una columna por varios nombres posibles (sin importar mayus/minus), para que si
   cambias el nombre de una columna en el Excel, el sitio la siga encontrando sola. */
function getField(p, candidates){
  const keys = Object.keys(p);
  for(const cand of candidates){
    const found = keys.find(k => k.toLowerCase() === cand.toLowerCase());
    if(found && p[found]) return p[found];
  }
  return '';
}
function getID(p){ return getField(p, ['id','ID']); }
function getPRODUCTO(p){ return getField(p, ['Producto','PRODUCTO','name']); }
function getStockRaw(p){ return getField(p, ['Stock','stock']); }
function getDescripcion(p){ return getField(p, ['Descripcion','description','Descripción']); }
function getPriceRaw(p){ return getField(p, ['Precio','price']); }
function getUrl(p){ return getField(p, ['Url','url','URL']); }
function getEstado(p){ return getField(p, ['Estado','estado']).trim().toLowerCase(); }
function getPreventaUnits(p){
  const raw = getField(p, ['Preventa','EnCamino','En camino','En Camino']);
  let cleaned = String(raw).replace(/[^0-9,\-]/g, '');
  cleaned = cleaned.replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : Math.round(n);
}

/* Limpia el precio: quita "S/.", espacios, etc. y convierte la coma decimal en punto.
   Solo conserva digitos y la coma (el punto de "S/." se descarta, no es parte del numero) */
function parsePrice(raw){
  if(!raw) return 0;
  let cleaned = String(raw).replace(/[^0-9,\-]/g, '');
  cleaned = cleaned.replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

/* Si el texto de una categoria en el Excel no es como quieres mostrarlo en pantalla,
   agrega aqui el texto de reemplazo (izquierda = como esta en el Excel, derecha = como se muestra) */
const DISPLAY_ALIASES = {
  'FIGURA': 'FIGURAS',
  'PALOMERA': 'PALOMERAS'
};
function displayName(name){
  const n = (name || '').trim();
  return DISPLAY_ALIASES[n] || n;
}

/* Pocas extensiones, sin combinar mayusculas/minusculas del nombre: maximo 6 intentos por imagen,
   para no saturar GitHub Pages con peticiones fallidas (eso disparaba el bloqueo "Rate limit exceeded") */
const IMG_EXTS = ['jpg','jpeg','png','webp','gif','JPG','JPEG','PNG','WEBP','GIF'];

/* Codifica cada segmento de una ruta con carpetas sin romper las barras "/" */
function encodePath(path){
  return path.split('/').map(seg => encodeURIComponent(seg)).join('/');
}

/* Imagen en la raiz del sitio. Usa el nombre EXACTO tal como esta escrito, sin adivinar mayusculas. */
function imgCandidates(name){
  const trimmed = (name || '').trim();
  return IMG_EXTS.map(ext => `A/${encodeURIComponent(trimmed)}.${ext}`);
}
function imgFirstSrc(name){
  return imgCandidates(name)[0];
}
function imgFallback(el, name, fallback){
  if(!el.dataset.candidates){
    el.dataset.candidates = JSON.stringify(imgCandidates(name));
    el.dataset.tryIdx = '0';
  }
  const candidates = JSON.parse(el.dataset.candidates);
  const idx = parseInt(el.dataset.tryIdx) + 1;
  if(idx < candidates.length){
    el.dataset.tryIdx = idx;
    el.src = candidates[idx];
  } else if(fallback && el.src !== fallback){
    el.src = fallback;
  } else {
    el.style.display = 'none';
  }
}

/* Imagen dentro de una carpeta. Usa el nombre y la carpeta EXACTOS, sin adivinar variantes. */
/* Si el nombre tiene un "(" pegado a la letra anterior (ej. "ETIQUETA(64)"), agrega tambien
   la variante con espacio ("ETIQUETA (64)") por si el archivo de foto si tiene ese espacio */
function spacedVariant(name){
  return name.replace(/([^\s])\(/g, '$1 (');
}
function resolveImageSrc(candidates){
  return new Promise((resolve)=>{
    let i = 0;
    function tryNext(){
      if(i >= candidates.length){ resolve(candidates[0] || ''); return; }
      const testImg = new Image();
      testImg.onload = ()=> resolve(candidates[i]);
      testImg.onerror = ()=> { i++; tryNext(); };
      testImg.src = candidates[i];
    }
    tryNext();
  });
}
const prodImgCache = {};

function imgCandidatesIn(folder, name){
  const f = (folder || '').trim();
  const trimmed = (name || '').trim();
  const spaced = spacedVariant(trimmed);
  const names = spaced !== trimmed ? [trimmed, spaced] : [trimmed];
  const list = [];
  names.forEach(n => IMG_EXTS.forEach(ext => list.push(`A/${encodePath(f)}/${encodeURIComponent(n)}.${ext}`)));
  return list;
}
function imgFirstSrcIn(folder, name){
  return imgCandidatesIn(folder, name)[0];
}
function imgFallbackIn(el, folder, name, fallback){
  if(!el.dataset.candidatesIn){
    el.dataset.candidatesIn = JSON.stringify(imgCandidatesIn(folder, name));
    el.dataset.tryIdxIn = '0';
  }
  const candidates = JSON.parse(el.dataset.candidatesIn);
  const idx = parseInt(el.dataset.tryIdxIn) + 1;
  if(idx < candidates.length){
    el.dataset.tryIdxIn = idx;
    el.src = candidates[idx];
  } else if(fallback && el.src !== fallback){
    el.src = fallback;
  } else {
    el.style.display = 'none';
  }
}

/* Para imagenes con lista de candidatos ya armada (varias rutas posibles a probar en orden) */
function imgFallbackList(el){
  if(!el.dataset.idx){
    el.dataset.cands = el.getAttribute('data-cands');
    el.dataset.idx = '0';
  }
  const cands = JSON.parse(el.dataset.cands);
  const idx = parseInt(el.dataset.idx) + 1;
  if(idx < cands.length){
    el.dataset.idx = idx;
    el.src = cands[idx];
  } else {
    el.style.display = 'none';
  }
}

function getStockNum(p){
  const n = parseInt(getStockRaw(p));
  return isNaN(n) ? 0 : n;
}

function getDiscountPercent(p){
  for(const key in p){
    if(key.toLowerCase().includes('descuento')){
      const raw = (p[key] || '').replace('%','').trim();
      const n = parseFloat(raw);
      if(!isNaN(n) && n > 0) return n;
    }
  }
  return 0;
}

function getFinalPrice(p){
  const base = parsePrice(getPriceRaw(p));
  const discount = getDiscountPercent(p);
  return discount > 0 ? base * (1 - discount / 100) : base;
}

function qtyInCart(id){
  const item = getCart().find(i => i.id === id);
  return item ? item.qty : 0;
}

/* Si el texto de CATEGORIA1 en el Excel no coincide con el nombre real de la carpeta en GitHub,
   agrega aqui el alias correcto (izquierda = como esta en el Excel, derecha = nombre real de la carpeta) */
const FOLDER_ALIASES = {
  'FIGURA': 'FIGURAS',
  'PALOMERA': 'PALOMERAS'
};
function resolveFolder(name){
  const n = (name || '').trim();
  return FOLDER_ALIASES[n] || n;
}

function productImgCandidates(p){
  const cat1 = resolveFolder(getCatLevel(p,1));
  const list = [...imgCandidatesIn(cat1, getID(p))];
  if(p.img) list.push(p.img);
  return list;
}

function productCardHTML(p){
  const estado = getEstado(p);
  const isForcedOut = estado === 'agotado';
  const rawStock = isForcedOut ? 0 : getStockNum(p);
  const preventaUnits = getPreventaUnits(p);
  const isPreventa = !isForcedOut && (estado === 'preventa' || (rawStock <= 0 && preventaUnits > 0));

  const stockNum = rawStock;
  const inStock = stockNum > 0 || isPreventa;
  const inCart = qtyInCart(getID(p));
  const canAddMore = isPreventa ? true : (inStock && inCart < stockNum);

  const basePrice = parsePrice(getPriceRaw(p));
  const discount = getDiscountPercent(p);
  const finalPrice = getFinalPrice(p);

  const priceHTML = !inStock
    ? ''
    : discount > 0
      ? `<div class="price-wrap">
           <span class="price-old">S/${basePrice.toFixed(2)}</span>
           <span class="discount-badge">-${discount}%</span>
           <span class="price-new"><span class="yn">S/</span>${finalPrice.toFixed(2)}</span>
         </div>`
      : `<div class="price"><span class="yn">S/</span>${basePrice.toFixed(2)}</div>`;

  let btnHTML;
  if(isPreventa){
    btnHTML = `<button type="button" class="add-cart-btn preventa-btn" data-id="${getID(p)}">Reservar (Preventa)</button>`;
  } else if(!inStock){
    btnHTML = `<button type="button" class="add-cart-btn" disabled>Agotado</button>`;
  } else if(!canAddMore){
    btnHTML = `<button type="button" class="add-cart-btn" disabled>Stock máximo en carrito</button>`;
  } else {
    btnHTML = `<button type="button" class="add-cart-btn" data-id="${getID(p)}">Agregar al carro</button>`;
  }

  const allCats = [1,2,3,4].map(l=>displayName(getCatLevel(p,l))).filter(Boolean).join(' / ');
  const url = getUrl(p);
  const desc = getDescripcion(p);
  const moreInfoHTML = url ? `<a class="prod-more-info" href="${url}" target="_blank">Más información →</a>` : '';
  const preventaNoticeHTML = (stockNum > 0 && preventaUnits > 0)
    ? `<div class="preventa-notice">🕐 +${preventaUnits} más en camino (consulta por preventa)</div>`
    : '';
  const descHTML = desc ? `<div class="prod-desc">${desc}</div>` : '';

  const prodCands = productImgCandidates(p);
  const prodData = JSON.stringify(prodCands).replace(/"/g, '&quot;');
  const firstSrc = prodImgCache[getID(p)] || prodCands[0];

  return `<div class="prod-card">
    <div class="prod-img ${inStock?'':'out-of-stock'}">
      <span class="stock-badge ${isPreventa?'preventa':(inStock?'in':'out')}">${isPreventa?'Preventa':(inStock?'En stock':'Agotado')}</span>
      <img src="${firstSrc}" data-cands="${prodData}" alt="${getPRODUCTO(p)}" loading="lazy" class="zoomable" onerror="imgFallbackList(this)">
    </div>
    <div class="prod-body">
      <span class="prod-cat">${allCats}</span>
      <div class="prod-name">${getPRODUCTO(p)}</div>
      <div class="prod-footer">
        ${priceHTML}
      </div>
      ${preventaNoticeHTML}
      ${descHTML}
      ${moreInfoHTML}
      ${btnHTML}
    </div>
  </div>`;
}

const params = new URLSearchParams(window.location.search);
let selectedLevels = [];
for(let level=1; level<=MAX_LEVELS; level++){
  const key = level===1 ? 'cat' : `sub${level}`;
  const val = params.get(key);
  if(val) selectedLevels[level-1] = val;
}

let allProducts = [];

fetch(CSV_URL)
  .then(r=>r.text())
  .then(text=>{
    const rows=parseCSV(text);
    allProducts = toObjects(rows).filter(p=>getPRODUCTO(p));
    allProducts.forEach((p, i) => { p._rowIndex = i; });
    buildNav();
    buildFilterSidebar();
    updateTitle();
    updateNavActiveState();

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);
    document.getElementById('onlyStockToggle').addEventListener('click', function(){
      this.classList.toggle('active'); render();
    });
    document.getElementById('showPreventaToggle').addEventListener('click', function(){
      this.classList.toggle('active'); render();
    });

    const qParam = params.get('q');
    if(qParam) document.getElementById('searchInput').value = qParam;

    setupSearchBar(allProducts);
    render();
  })
  .catch(()=>{
    document.getElementById('catProducts').innerHTML =
      '<div class="empty-state">No se pudo cargar el catálogo en este momento. Verifica tu conexión o intenta más tarde.</div>';
  });

function updateTitle(){
  document.getElementById('catTitle').textContent = displayName(selectedLevels[0]) || 'Todos los productos';
}

function updateNavActiveState(){
  const links = document.querySelectorAll('#navCats > .nav-item > a');
  links.forEach(a=>{
    const url = new URL(a.getAttribute('href'), window.location.href);
    const linkCat = url.searchParams.get('cat') || '';
    const isActive = linkCat === (selectedLevels[0] || '');
    a.classList.toggle('active-link', isActive);
  });
}

function matchesSelection(p, upToLevel){
  for(let i=0;i<upToLevel;i++){
    if(selectedLevels[i] && getCatLevel(p, i+1) !== selectedLevels[i]) return false;
  }
  return true;
}

/* ===== Barra lateral: filtros en cascada (Categoria -> Subcategoria 1 -> 2 -> 3...) hasta que ya no haya mas niveles ===== */
function buildFilterSidebar(){
  const container = document.getElementById('filterLevels');
  container.innerHTML = '';

  for(let level=1; level<=MAX_LEVELS; level++){
    const base = allProducts.filter(p => matchesSelection(p, level-1));
    const values = [...new Set(base.map(p=>getCatLevel(p, level)).filter(Boolean))];
    if(values.length === 0) break;

    const placeholder = level===1 ? 'Elegir categoría' : 'Elegir subcategoría';
    const currentVal = selectedLevels[level-1] || '';

    const div = document.createElement('div');
    div.className = 'cat-filter-box';
    div.innerHTML = `<select>
        <option value="">${placeholder}</option>
        ${values.map(v=>`<option value="${v}"${v===currentVal?' selected':''}>${displayName(v)}</option>`).join('')}
      </select>`;
    container.appendChild(div);

    div.querySelector('select').addEventListener('change', (e)=>{
      selectedLevels = selectedLevels.slice(0, level-1);
      if(e.target.value) selectedLevels[level-1] = e.target.value;
      buildFilterSidebar();
      updateTitle();
      updateNavActiveState();
      render();
    });
  }
}

document.getElementById('clearFilters').addEventListener('click', ()=>{
  selectedLevels = [];
  buildFilterSidebar();
  updateTitle();
  updateNavActiveState();
  render();
});

/* ===== Nav superior con menu en cascada (CATEGORIA1 -> 2 -> 3 -> 4, tantos niveles como haya datos) ===== */
function buildLevel(items, level, urlParams){
  let values=[...new Set(items.map(p=>getCatLevel(p, level)).filter(Boolean))];
  if(values.length === 0) return '';
  if(level === 1){
    values = values.sort((a,b)=>{
      const countA = items.filter(p=>getCatLevel(p,1)===a).length;
      const countB = items.filter(p=>getCatLevel(p,1)===b).length;
      return countB - countA;
    });
  }

  const linksHTML = values.map(v=>{
    const key = level===1 ? 'cat' : `sub${level}`;
    const newParams = Object.assign({}, urlParams, {[key]: v});
    const href = 'category.html?' + new URLSearchParams(newParams).toString();
    const filtered = items.filter(p=>getCatLevel(p, level)===v);
    const childHTML = buildLevel(filtered, level+1, newParams);

    if(level === 1){
      const isActive = v === (selectedLevels[0]||'') ? ' class="active-link"' : '';
      return `<div class="nav-item"><a href="${href}"${isActive}>${displayName(v)}</a>${childHTML}</div>`;
    }
    const hasChildren = childHTML !== '';
    return `<div class="nav-subitem${hasChildren?' has-children':''}"><a href="${href}">${displayName(v)}</a>${childHTML}</div>`;
  }).join('');

  if(level === 1) return linksHTML;
  const wrapClass = level === 2 ? 'nav-dropdown' : 'nav-dropdown-l2';
  return `<div class="${wrapClass}"><div class="nav-dropdown-inner">${linksHTML}</div></div>`;
}

function buildNav(){
  const nav=document.getElementById('navCats');
  const todoActive = !selectedLevels[0] ? ' class="active-link"' : '';
  nav.innerHTML = `<div class="nav-item"><a href="category.html"${todoActive}>Todo</a></div>` + buildLevel(allProducts, 1, {});
}

/* 6 filas x 4 columnas por carga (al presionar "Cargar mas" se suman 6 filas mas) */
const PAGE_SIZE = 24;
let currentList = [];
let visibleCount = PAGE_SIZE;

function isPreventaProduct(p){
  const estado = getEstado(p);
  if(estado === 'agotado') return false;
  const rawStock = getStockNum(p);
  return estado === 'preventa' || (rawStock <= 0 && getPreventaUnits(p) > 0);
}

function render(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();

  let list = term
    ? allProducts.slice()
    : allProducts.filter(p => matchesSelection(p, selectedLevels.length));

  if(document.getElementById('onlyStockToggle').classList.contains('active')){
    list = list.filter(p => getStockNum(p) > 0 || isPreventaProduct(p));
  }

  if(!document.getElementById('showPreventaToggle').classList.contains('active')){
    list = list.filter(p => !isPreventaProduct(p));
  }

  if(term){
    list = list.filter(p => {
      if(getPRODUCTO(p).toLowerCase().includes(term)) return true;
      for(let level=1; level<=MAX_LEVELS; level++){
        if(getCatLevel(p, level).toLowerCase().includes(term)) return true;
      }
      return false;
    });
  }

  const sortVal = document.getElementById('sortSelect').value;
  const cmp =
    sortVal === 'price-asc' ? (a,b)=>getFinalPrice(a) - getFinalPrice(b) :
    sortVal === 'price-desc' ? (a,b)=>getFinalPrice(b) - getFinalPrice(a) :
    sortVal === 'alpha' ? (a,b)=>getPRODUCTO(a).localeCompare(getPRODUCTO(b)) :
    (a,b)=>b._rowIndex - a._rowIndex;

  function stockTier(p){
    if(getStockNum(p) > 0) return 0;   // stock real: primero
    if(isPreventaProduct(p)) return 1; // preventa: despues
    return 2;                          // agotado: al final
  }

  list.sort((a,b)=>{
    const outA = stockTier(a);
    const outB = stockTier(b);
    if(outA !== outB) return outA - outB;
    return cmp(a,b);
  });

  document.getElementById('catCount').textContent = `${list.length} producto${list.length===1?'':'s'}`;

  currentList = list;
  visibleCount = PAGE_SIZE;
  renderProducts();
}

function renderProducts(){
  const container = document.getElementById('catProducts');
  if(currentList.length === 0){
    container.innerHTML = '<div class="empty-state">No se encontraron productos con estos filtros.</div>';
    return;
  }

  const slice = currentList.slice(0, visibleCount);
  const remaining = currentList.length - visibleCount;
  const moreBtn = remaining > 0
    ? `<div class="load-more-row">
         <button type="button" id="loadMoreBtn" class="load-more-btn">Cargar más productos (${remaining} restantes)</button>
         <button type="button" id="loadAllBtn" class="load-more-btn load-all-btn">Ver TODO (${currentList.length})</button>
       </div>`
    : '';

  container.innerHTML = `<div class="prod-grid">${slice.map(productCardHTML).join('')}</div>${moreBtn}`;

  /* Precarga en segundo plano: resuelve la foto real de cada producto visible una sola vez,
     asi la proxima vez que se redibuje (orden, filtro, "cargar mas") ya esta lista al instante */
  slice.forEach(p=>{
    const id = getID(p);
    if(prodImgCache[id]) return;
    resolveImageSrc(productImgCandidates(p)).then(src => { prodImgCache[id] = src; });
  });

  container.querySelectorAll('.add-cart-btn').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', function(){
      const p = allProducts.find(x => getID(x) === btn.dataset.id);
      if(!p) return;
      const cands = productImgCandidates(p);
      addToCart({ id:getID(p), name:getPRODUCTO(p), price:getFinalPrice(p), img:cands[0], cands:cands, folder:getCatLevel(p,1), fallbackImg:p.img, stock: getStockNum(p) });
      if(typeof openMiniCart === 'function') openMiniCart(3000);
      renderProducts();
    });
  });

  container.querySelectorAll('.zoomable').forEach(img=>{
    img.addEventListener('click', ()=> openImgModal(img.src, img.alt));
  });

  const loadMoreBtn = document.getElementById('loadMoreBtn');
  if(loadMoreBtn){
    loadMoreBtn.addEventListener('click', ()=>{
      visibleCount += PAGE_SIZE;
      renderProducts();
    });
  }

  const loadAllBtn = document.getElementById('loadAllBtn');
  if(loadAllBtn){
    loadAllBtn.addEventListener('click', ()=>{
      visibleCount = currentList.length;
      renderProducts();
    });
  }
}

/* ===== Buscador con sugerencias desplegables (category: sincroniza con el buscador del panel) ===== */
function setupSearchBar(products){
  const input = document.getElementById('topSearch');
  const box = document.getElementById('topSuggest');
  const sideInput = document.getElementById('searchInput');
  if(!input || !box) return;

  input.value = sideInput.value;

  function matches(term){
    const t = term.trim().toLowerCase();
    if(!t) return [];
    return products.filter(p=>{
      const hay = (getPRODUCTO(p)+' '+getCatLevel(p,1)+' '+getCatLevel(p,2)).toLowerCase();
      return hay.includes(t);
    }).slice(0, 8);
  }

  function renderSuggest(term){
    const list = matches(term);
    if(!list.length){ box.innerHTML=''; box.classList.remove('open'); return; }
    box.innerHTML = list.map(p=>`<button type="button" class="suggest-row" data-name="${getPRODUCTO(p).replace(/"/g,'&quot;')}">
        <span class="sg-name">${getPRODUCTO(p)}</span>
        <span class="sg-cat">${displayName(getCatLevel(p,1))}</span>
      </button>`).join('');
    box.classList.add('open');
  }

  function apply(term){
    input.value = term;
    sideInput.value = term;
    box.classList.remove('open');
    render();
  }

  input.addEventListener('input', ()=>{ sideInput.value = input.value; render(); renderSuggest(input.value); });
  input.addEventListener('focus', ()=> { if(input.value.trim()) renderSuggest(input.value); });
  box.addEventListener('click', (e)=>{
    const row = e.target.closest('.suggest-row');
    if(row) apply(row.dataset.name);
  });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.search-bar')) box.classList.remove('open'); });
  document.getElementById('topSearchBtn').addEventListener('click', ()=> apply(input.value));
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ apply(input.value); } });
}

function openImgModal(src, alt){
  const pic = document.getElementById('imgModalPic');
  pic.src = src;
  pic.alt = alt || '';
  pic.classList.remove('zoomed');
  pic.style.transform = '';
  document.getElementById('imgModal').classList.add('open');
}
function closeImgModal(){
  document.getElementById('imgModal').classList.remove('open');
}
document.getElementById('imgModalClose').addEventListener('click', closeImgModal);
document.getElementById('imgModal').addEventListener('click', (e)=>{
  if(e.target.id === 'imgModal') closeImgModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeImgModal();
});

/* ===== ZOOM SIMPLE: clic para acercar 40% en el punto exacto, otro clic para quitar ===== */
const imgModalPic = document.getElementById('imgModalPic');
const CLICK_ZOOM = 1.65;

function toggleZoomAt(clientX, clientY){
  const zoomed = imgModalPic.classList.toggle('zoomed');
  if(zoomed){
    const rect = imgModalPic.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));
    imgModalPic.style.transformOrigin = `${x}% ${y}%`;
    imgModalPic.style.transform = `scale(${CLICK_ZOOM})`;
  } else {
    imgModalPic.style.transform = 'scale(1)';
    imgModalPic.style.transformOrigin = 'center center';
  }
}

imgModalPic.addEventListener('click', (e)=>{
  e.stopPropagation();
  toggleZoomAt(e.clientX, e.clientY);
});

/* ===== BOTON SUBIR ARRIBA ===== */
const backToTop = document.getElementById('backToTop');
if(backToTop){
  window.addEventListener('scroll', ()=>{
    backToTop.classList.toggle('show', window.scrollY > 400);
  });
  backToTop.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
