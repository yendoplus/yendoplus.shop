<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Categoría — Yendo Plus</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site">
  <div class="logo-wrap">
    <a href="index.html"><img src="logo.jpg" alt="Yendo Plus"></a>
  </div>
  <nav class="main" id="navCats"></nav>
  <div class="socials-top">
    <button id="themeToggle" class="theme-switch" aria-label="Cambiar tema" aria-pressed="false">
      <span class="theme-switch-track">
        <span class="theme-switch-icon">☀️</span>
        <span class="theme-switch-icon">🌙</span>
        <span class="theme-switch-thumb"></span>
      </span>
    </button>
    <div class="cart-wrap" id="cartWrap">
      <button id="cartToggle" class="cart-link" aria-label="Ver carrito">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Carrito <span id="cartBadge" class="cart-badge">0</span>
      </button>
      <div class="mini-cart" id="miniCart">
        <div class="mini-cart-top">
          <span id="miniCartCount">0 items</span>
          <span id="miniCartTotal">S/0.00</span>
        </div>
        <a href="cart.html" class="mini-cart-checkout">IR AL CARRITO</a>
        <div class="mini-cart-items" id="miniCartItems"></div>
      </div>
    </div>
  </div>
</header>

<section class="section" style="border-bottom:none;">
  <div class="section-head">
    <h2 id="catTitle">Categoría</h2>
    <span class="sub" id="catCount">Cargando…</span>
  </div>

  <div class="cat-page-layout">
    <aside class="cat-sidebar">
      <div class="sidebar-block">
        <label for="searchInput">Buscar por nombre</label>
        <input type="text" id="searchInput" placeholder="Ej: Broly, Frieren...">
      </div>

      <div class="sidebar-block">
        <label for="sortSelect">Ordenar por</label>
        <select id="sortSelect">
          <option value="default">Relevancia</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="alpha">Alfabético (A-Z)</option>
        </select>
      </div>

      <div class="sidebar-block">
        <label>Subcategoría</label>
        <div id="subFilterList" class="subfilter-list"></div>
      </div>

      <a href="index.html" class="back-link" style="text-align:left;margin-top:20px;">← Ver todas las categorías</a>
    </aside>

    <div class="cat-page-products" id="catProducts">
      <div class="loading">Cargando productos…</div>
    </div>
  </div>
</section>

<div class="img-modal" id="imgModal">
  <button class="img-modal-close" id="imgModalClose" aria-label="Cerrar">✕</button>
  <img id="imgModalPic" src="" alt="">
</div>

<button id="backToTop" class="back-to-top" aria-label="Subir arriba">↑</button>

<script src="theme.js"></script>
<script src="cart.js"></script>
<script src="catalog.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const urlCat = params.get('cat') || '';
const urlSub = params.get('sub') || '';

let allProducts = [];
let selectedSubs = new Set(urlSub ? [urlSub] : []);

loadProducts((products, err)=>{
  if(err){
    document.getElementById('catProducts').innerHTML =
      '<div class="empty-state">No se pudo cargar el catálogo en este momento. Verifica tu conexión o intenta más tarde.</div>';
    return;
  }
  allProducts = products;

  const cats = [...new Set(products.map(p=>p.category).filter(Boolean))];

  // Nav con dropdown (igual que en la pagina principal)
  const nav = document.getElementById('navCats');
  nav.innerHTML = cats.map(c=>{
    const subs = [...new Set(products.filter(p=>p.category===c).map(p=>p.subcategory).filter(Boolean))];
    const subLinks = subs.map(s=>
      `<a href="category.html?cat=${encodeURIComponent(c)}&sub=${encodeURIComponent(s)}">${s}</a>`
    ).join('');
    return `<div class="nav-item">
      <a href="category.html?cat=${encodeURIComponent(c)}" class="nav-cat-link${c===urlCat?' active':''}">${c}</a>
      ${subs.length ? `<div class="nav-dropdown"><div class="nav-dropdown-inner">${subLinks}</div></div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('catTitle').textContent = urlCat || 'Todos los productos';

  // Lista base: filtrada por categoria si viene en la URL
  const baseList = urlCat ? products.filter(p=>p.category===urlCat) : products;

  // Subcategorias disponibles dentro de esta categoria
  const subs = [...new Set(baseList.map(p=>p.subcategory).filter(Boolean))];
  const subFilterList = document.getElementById('subFilterList');
  if(subs.length === 0){
    subFilterList.innerHTML = '<p class="form-note" style="margin-top:0;">No hay subcategorías.</p>';
  } else {
    subFilterList.innerHTML = subs.map(s=>
      `<button type="button" class="subfilter-chip${selectedSubs.has(s)?' selected':''}" data-sub="${s}">${s}</button>`
    ).join('');
    subFilterList.querySelectorAll('.subfilter-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const s = btn.dataset.sub;
        if(selectedSubs.has(s)) selectedSubs.delete(s);
        else selectedSubs.add(s);
        btn.classList.toggle('selected');
        render();
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('sortSelect').addEventListener('change', render);

  render();

  function render(){
    let list = baseList.slice();

    if(selectedSubs.size > 0){
      list = list.filter(p => selectedSubs.has(p.subcategory));
    }

    const term = document.getElementById('searchInput').value.trim().toLowerCase();
    if(term){
      list = list.filter(p =>
        p.name.toLowerCase().includes(term) ||
        (p.category||'').toLowerCase().includes(term) ||
        (p.subcategory||'').toLowerCase().includes(term)
      );
    }

    const sortVal = document.getElementById('sortSelect').value;
    if(sortVal === 'price-asc'){
      list.sort((a,b)=>(parseFloat(a.price)||0) - (parseFloat(b.price)||0));
    } else if(sortVal === 'price-desc'){
      list.sort((a,b)=>(parseFloat(b.price)||0) - (parseFloat(a.price)||0));
    } else if(sortVal === 'alpha'){
      list.sort((a,b)=>a.name.localeCompare(b.name));
    }

    document.getElementById('catCount').textContent = `${list.length} producto${list.length===1?'':'s'}`;

    const container = document.getElementById('catProducts');
    if(list.length === 0){
      container.innerHTML = '<div class="empty-state">No se encontraron productos con estos filtros.</div>';
      return;
    }
    container.innerHTML = `<div class="prod-grid">${list.map(productCardHTML).join('')}</div>`;
    attachProductGridHandlers(container, allProducts);
  }
});
</script>

</body>
</html>
